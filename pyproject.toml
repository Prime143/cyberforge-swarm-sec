[project]
name = "cyberforge-swarm-sec"
version = "1.0.0"
description = "Autonomous UAV Telemetry & Anti-Spoofing Gateway"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=services"
testpaths = [
    "services",
]

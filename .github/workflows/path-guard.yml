name: Path Guard & Blast Radius Check

on:
  pull_request:
    branches: [ main ]

jobs:
  enforce-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Enforce Strict Blast Radius
        run: |
          AUTHOR="${{ github.actor }}"
          echo "PR Author: $AUTHOR"
          
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ "$file" =~ ^contracts/ ]] || [[ "$file" =~ ^\.github/ ]]; then
              if [[ "$AUTHOR" != "vijayukande" ]]; then
                echo "CRITICAL: Candidate $AUTHOR attempted to alter core contracts/CI: $file"
                exit 1
              fi
            fi
          done
